name: Mobile App CI

on:
  push:
    branches: [master, main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']

jobs:
  verify:
    name: Typecheck and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Catches missing native peer dependencies, which otherwise only surface
      # as a crash on a real device.
      - name: Expo doctor
        run: npx expo-doctor@latest

      # Proves the app actually bundles for both platforms before it is built.
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/export-ios

      - name: Bundle for Android
        run: npx expo export --platform android --output-dir /tmp/export-android
